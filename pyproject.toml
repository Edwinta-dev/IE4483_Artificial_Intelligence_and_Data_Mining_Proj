[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ie4483"
version = "0.1.0"
description = "IE4483 image classification project"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "torchvision", "matplotlib", "Pillow", "PyYAML"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/ie4483"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Long prose and YAML fixture strings.
"tests/*" = ["E501"]
"scripts/cifar_report.py" = ["E501"]
"scripts/classification_figure.py" = ["E501"]
"scripts/export_report_summary.py" = ["E501"]
